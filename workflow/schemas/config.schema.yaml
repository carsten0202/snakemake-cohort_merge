$schema: https://json-schema.org/draft/2020-12/schema

title: Cohort merge and population structure configuration
description: Configuration for merging a super-cohort and analyzing its population structure.
type: object
additionalProperties: false

required:
  - super_cohort
  - output_directory
  - chromosomes
  - input
  - cohorts
  - modules
  - resources

properties:
  super_cohort:
    type: string
    minLength: 1
    description: Name of the resulting super-cohort.

  output_directory:
    type: string
    minLength: 1
    description: Directory in which workflow outputs will be written.

  chromosomes:
    type: array
    minItems: 1
    uniqueItems: true
    description: Canonical chromosome names used by the workflow.
    items:
      type: string
      pattern: '^chr(?:[1-9]|1[0-9]|2[0-2]|X)$'

  input:
    type: object
    additionalProperties: false
    required:
      - pattern
    properties:
      pattern:
        $ref: '#/$defs/vcfPattern'

  modules:
    type: object
    additionalProperties: false
    required:
      - bcftools
      - plink
      - quick_pcair
    properties:
      bcftools:
        $ref: '#/$defs/moduleList'
      plink:
        $ref: '#/$defs/moduleList'
      quick_pcair:
        $ref: '#/$defs/moduleList'

  resources:
    type: object
    additionalProperties: false
    required:
      - index_vcf
      - intersect_variants
      - summarize_intersection
      - merge_chromosome
      - concatenate_chromosomes
      - exclude_samples
      - convert_vcf_to_plink
      - run_quick_pcair
    properties:
      index_vcf:
        $ref: '#/$defs/ruleResources'
      intersect_variants:
        $ref: '#/$defs/ruleResources'
      summarize_intersection:
        $ref: '#/$defs/ruleResources'
      merge_chromosome:
        $ref: '#/$defs/ruleResources'
      concatenate_chromosomes:
        $ref: '#/$defs/ruleResources'
      exclude_samples:
        $ref: '#/$defs/ruleResources'
      convert_vcf_to_plink:
        $ref: '#/$defs/ruleResources'
      run_quick_pcair:
        $ref: '#/$defs/ruleResources'

  cohorts:
    type: object
    minProperties: 2
    description: Cohorts contributing VCF files to the super-cohort.
    propertyNames:
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
    additionalProperties:
      $ref: '#/$defs/cohort'

$defs:
  moduleList:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1

  ruleResources:
    type: object
    additionalProperties: false
    required:
      - threads
      - mem_mb
    properties:
      threads:
        type: integer
        minimum: 1
      mem_mb:
        type: integer
        minimum: 1

  vcfPattern:
    type: string
    minLength: 1
    description: >
      VCF filename pattern. The {chromosome} placeholder is replaced with
      the cohort-specific chromosome name.
    allOf:
      - pattern: '[{]chromosome[}]'
      - pattern: '[.]vcf[.]gz$'

  cohort:
    type: object
    additionalProperties: false
    required:
      - directory
    properties:
      directory:
        type: string
        minLength: 1
        description: Directory containing this cohort's chromosome VCFs.

      pattern:
        $ref: '#/$defs/vcfPattern'
        description: Optional cohort-specific pattern overriding input.pattern.

      chromosome_aliases:
        type: object
        additionalProperties: false
        description: Mapping from canonical chromosomes to cohort filenames.
        properties:
          chrX:
            type: string
            const: chr23

      exclude_samples:
        type: string
        minLength: 1
        description: >
          Optional whitespace-delimited file of samples to exclude. The first
          column is interpreted as the VCF sample identifier.
